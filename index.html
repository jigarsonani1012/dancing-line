<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1233" />
    <title>Dancing Line</title>
    <link rel="icon" href="data:," />

    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ==================================================================
         SVG SYMBOLS
         ================================================================== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 17h18l-1.7-9-4.3 3.8L12 5l-3 6.8L4.7 8 3 17zm1 2h16v2H4z"/></symbol>
        <symbol id="i-gem" viewBox="0 0 24 24"><path d="M12 2l10 7-10 13L2 9z" fill="#5fd3ff"/><path d="M12 6.2l5.4 3.2L12 17.6 6.6 9.4z" fill="#fff" opacity=".8"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></symbol>
        <symbol id="i-restart" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16v2.5H4zm0 5h16v2.5H4zm0 5h16v2.5H4z"/></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 4.5v15l10-7.5zM17 4.5h2.5v15H17z"/></symbol>
        <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></symbol>
        <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></symbol>
        <symbol id="i-line" viewBox="0 0 32 32"><path d="M5 25 L13 17 L19 23 L27 7" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="miter"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3H9l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L9 20.7h6l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><path d="M17 9V7A5 5 0 0 0 7 7v2H5v12h14V9h-2zM9 7a3 3 0 0 1 6 0v2H9V7z"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></symbol>
        <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11.2V4.5a1.8 1.8 0 0 1 3.6 0v5.3l7.3 2.2a1.4 1.4 0 0 1 .9 1.7l-1.4 5.6a1.4 1.4 0 0 1-1.7 1L9 17.1l-4.6-1.6a1.6 1.6 0 0 1-.2-3l4.8-1.3Z"/></symbol>
        <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8 1.8-1.8L10.6 12l6.2-6.2z"/></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 4l8 8-8 8-1.8-1.8L13.4 12 7.2 5.8z"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4l-6.3 6.3-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></symbol>
        <symbol id="i-journey" viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.5 3.5 10.7 8 12 4.5-1.3 8-6.5 8-12V6l-8-4zm-1 14l-4-4 1.4-1.4L11 13.2l5.6-5.6L18 9l-7 7z"/></symbol>
        <symbol id="i-skin" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.4-1.4 3.6 3.6 7.6-7.6L18 8l-6 9z"/></symbol>
      </defs>
    </svg>

    <div id="app">
      <div id="stage"></div>
      <div id="vignette"></div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div id="topbar">
          <div id="progress">
            <div id="barTrack">
              <div id="barFill"></div>
              <div class="crownMark" style="left:20%"><svg><use href="#i-crown"/></svg></div>
              <div class="crownMark" style="left:50%"><svg><use href="#i-crown"/></svg></div>
              <div class="crownMark" style="left:80%"><svg><use href="#i-crown"/></svg></div>
            </div>
            <div id="pct">0%</div>
          </div>
          <div id="gemPill"><svg><use href="#i-gem"/></svg><span id="gemVal">0</span>/10</div>
        </div>
        <div id="practiceChip" class="hidden">Practice</div>
        <div id="intro">
          <div class="introName" id="introName">The Beginning</div>
          <div class="introStars" id="introStars">★☆☆☆☆</div>
          <div class="introTag" id="introTag"></div>
          <div class="introTap" id="introTap">Tap to play</div>
        </div>
        <div id="tapNow" class="hidden"><svg><use href="#i-hand"/></svg>Tap</div>
      </div>
      <button id="pauseBtn" class="iconBtn hidden" type="button" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      <button id="muteBtn" class="iconBtn" type="button" aria-label="Mute"><svg id="icoSound"><use href="#i-sound"/></svg><svg id="icoMute" class="hidden"><use href="#i-mute"/></svg></button>

      <div id="fx"></div>
      <div id="toast"><svg id="toastCrown"><use href="#i-crown"/></svg><svg id="toastStar" class="hidden"><use href="#i-star"/></svg><span id="toastText">Checkpoint</span></div>
      <div id="flash"></div>
      <div id="fader"></div>

      <!-- HOME INTERFACE -->
      <div id="home" class="screen">
        <div class="wallet" id="homeWallet"><svg><use href="#i-gem"/></svg><span id="totalGems">0</span></div>

        <div class="homeCenter">
          <div class="logo">
            <svg class="logoIcon" viewBox="0 0 64 64" width="64" height="64">
              <defs>
                <!-- Vibrant Mint/Emerald Gradient -->
                <linearGradient id="iconBg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#34d399"/>
                  <stop offset="55%" stop-color="#10b981"/>
                  <stop offset="100%" stop-color="#059669"/>
                </linearGradient>
                <!-- Clean Top Glass Gloss -->
                <linearGradient id="iconGloss" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
                  <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                </linearGradient>
                <!-- Oceanic Blue Depth Shade -->
                <linearGradient id="ribbonDepth" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0284c7"/>
                  <stop offset="100%" stop-color="#0369a1"/>
                </linearGradient>
              </defs>

              <!-- Rounded Squircle Badge with subtle inner bevel -->
              <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#iconBg)"/>
              <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#iconGloss)"/>
              <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.2"/>

              <!-- Bold Depth Shadow Layer -->
              <path d="M 13 46.5 L 26 33.5 L 36 40.5 L 50 20" fill="none" stroke="url(#ribbonDepth)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>

              <!-- Crisp Pure White Path Ribbon -->
              <path d="M 13 43 L 26 30 L 36 37 L 50 16.5" fill="none" stroke="#ffffff" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>

              <!-- Glowing Cyan Head Orb -->
              <circle cx="50" cy="16.5" r="4.2" fill="#38bdf8" opacity="0.9"/>
              <circle cx="50" cy="16.5" r="2.4" fill="#ffffff"/>

              <!-- Golden Accent Star Sparkle -->
              <polygon points="18,13 19.5,17 23.5,18.5 19.5,20 18,24 16.5,20 12.5,18.5 16.5,17" fill="#ffd166" opacity="0.95"/>
            </svg>
            <h1>DANCING LINE</h1>
          </div>

          <div id="carousel">
            <button id="prevBtn" class="arrow" type="button" aria-label="Previous level"><svg><use href="#i-left"/></svg></button>
            <div id="card"></div>
            <button id="nextBtn" class="arrow" type="button" aria-label="Next level"><svg><use href="#i-right"/></svg></button>
          </div>

          <div id="dots"></div>
        </div>

        <!-- Bottom Cheetah-style navigation -->
        <div class="bottomNav">
          <button class="navTab active" id="tabJourney" type="button"><svg><use href="#i-journey"/></svg>Journey</button>
          <button class="navTab" id="tabSkin" type="button"><svg><use href="#i-skin"/></svg>Skins</button>
          <button class="navTab" id="tabSettings" type="button"><svg><use href="#i-gear"/></svg>Settings</button>
        </div>
      </div>

      <!-- SKINS MODAL -->
      <div id="skinScr" class="screen dim hidden">
        <div class="panel" style="max-width: 400px">
          <h2>Line Skins</h2>
          <div class="wallet" style="margin: .6rem auto 0; width: fit-content; background: rgba(0,0,0,.35)"><svg><use href="#i-gem"/></svg><span id="skinTotalGems">0</span></div>
          <div class="skinGrid" id="skinGrid"></div>
          <div class="note" id="skinNote">Collect diamonds in levels to unlock new lines.</div>
          <div class="btns" style="margin-top: 1rem">
            <button class="btn primary" id="skinClose" type="button"><svg><use href="#i-close"/></svg>Close</button>
          </div>
        </div>
      </div>

      <!-- SETTINGS MODAL -->
      <div id="settingsScr" class="screen dim hidden">
        <div class="panel">
          <h2>Settings</h2>
          <div style="margin-top:.8rem">
            <div class="row"><span>Music</span><button class="switch on" id="swMusic" type="button" aria-label="Music"></button></div>
            <div class="row"><span>Sound effects</span><button class="switch on" id="swSfx" type="button" aria-label="Sound effects"></button></div>
            <div class="row"><span>Screen shake</span><button class="switch on" id="swShake" type="button" aria-label="Screen shake"></button></div>
          </div>
          <div class="btns">
            <button class="btn primary" id="settingsClose" type="button"><svg><use href="#i-close"/></svg>Close</button>
            <button class="btn ghost" id="resetBtn" type="button">Reset progress</button>
          </div>
        </div>
      </div>

      <!-- PAUSE -->
      <div id="pauseScr" class="screen dim hidden">
        <div class="panel">
          <h2>Paused</h2>
          <div class="btns">
            <button class="btn primary" id="resumeBtn" type="button"><svg><use href="#i-play"/></svg>Resume</button>
            <button class="btn ghost" id="pRestartBtn" type="button"><svg><use href="#i-restart"/></svg>Restart</button>
            <button class="btn ghost" id="pLevelsBtn" type="button"><svg><use href="#i-list"/></svg>Levels</button>
          </div>
        </div>
      </div>

      <!-- GAME OVER -->
      <div id="overScr" class="screen dim hidden">
        <div class="panel">
          <h2 id="overTitle">You reached</h2>
          <div class="bigpct"><span id="overPct">0</span><small>%</small></div>
          <div id="overBest" class="badge hidden">New best</div>
          <div class="mini"><div class="miniFill" id="overFill"></div>
            <div class="crownMark" id="oc0" style="left:20%"><svg><use href="#i-crown"/></svg></div>
            <div class="crownMark" id="oc1" style="left:50%"><svg><use href="#i-crown"/></svg></div>
            <div class="crownMark" id="oc2" style="left:80%"><svg><use href="#i-crown"/></svg></div>
          </div>
          <div class="meta"><span>Best <b id="overBestVal">0%</b></span><span><svg><use href="#i-gem"/></svg><b id="overGems">0/10</b></span></div>
          <div class="btns">
            <button class="btn gold" id="continueBtn" type="button"><svg><use href="#i-crown"/></svg><span id="continueLabel">Continue</span><span class="cntPill" id="continueCnt">1 left</span></button>
            <button class="btn primary" id="retryBtn" type="button"><svg><use href="#i-restart"/></svg>Restart</button>
            <button class="btn ghost" id="oLevelsBtn" type="button"><svg><use href="#i-list"/></svg>Levels</button>
          </div>
        </div>
      </div>

      <!-- LEVEL COMPLETE -->
      <div id="doneScr" class="screen dim hidden">
        <div class="panel">
          <h2 id="doneTitle">Level complete</h2>
          <div class="bigpct">100<small>%</small></div>
          <div id="perfectBadge" class="badge hidden">★ Perfect ★</div>
          <div class="crownRow"><svg id="dc0"><use href="#i-crown"/></svg><svg id="dc1"><use href="#i-crown"/></svg><svg id="dc2"><use href="#i-crown"/></svg></div>
          <div class="meta"><span><svg><use href="#i-gem"/></svg><b id="doneGems">0/10</b></span><span><svg style="fill:#ffd166"><use href="#i-crown"/></svg><b id="doneCrowns">3/3</b></span></div>
          <div class="note" id="doneNote"></div>
          <div class="btns">
            <button class="btn primary" id="nextBtn2" type="button"><svg><use href="#i-next"/></svg>Next level</button>
            <button class="btn ghost" id="replayBtn" type="button"><svg><use href="#i-restart"/></svg>Replay</button>
            <button class="btn ghost" id="dLevelsBtn" type="button"><svg><use href="#i-list"/></svg>Levels</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================================================================
         GAME
         ================================================================== -->
    <script type="module" src="script.js"></script>
  </body>
</html>
